name: Free-plan keep-alive

# Keeps the Supabase free project from its 7-day inactivity pause and
# verifies both platform endpoints. Three independent layers protect
# availability (see docs/FREE_PLAN_OPTIMIZATION.md):
#   1. pg_cron job inside Postgres (03:43 UTC daily, runs a real query)
#   2. this workflow (04:17 UTC daily): edge function with a DB query,
#      the capri-ping liveness probe, the Vercel production page, and
#      the pg_cron armed/fresh assertion (step 4)
#   3. failure alerting: any dead endpoint fails this workflow, which
#      emails the repository actors
# The public repo makes scheduled runs free; all endpoints are keyless.
# Each probe retries to ride out edge-function deploy windows; a
# persistently failing run after a merge means the Supabase GitHub
# integration re-deployed a broken artifact (see the doc's incident
# note - re-deploy the functions via the connector to recover).

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

# A push to main and the daily schedule can overlap; one run always
# re-verifies every endpoint from scratch, so the newer run supersedes
# the older instead of both burning free-plan minutes in parallel.
concurrency:
  group: keep-alive-${{ github.ref }}
  cancel-in-progress: true

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      # scripts/check_probe.py validates probe JSON with unit-tested
      # logic (tests/test_check_probe.py) instead of inline greps.
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Supabase keep-alive (edge function with database query)
        run: |
          set -euo pipefail
          url="https://znpvstwmzyphmvkhigqp.supabase.co/functions/v1/capri-keepalive"
          resp=""
          for attempt in 1 2 3 4 5; do
            resp="$(curl -sS --max-time 30 "$url" || true)"
            if printf '%s' "$resp" | python3 scripts/check_probe.py --true ok,under_limit; then
              break
            fi
            echo "attempt $attempt: unexpected response: $resp"
            sleep 10
          done
          echo "$resp"
          # Budget watchdog: fails the run (and emails actors) once the
          # database or storage crosses 80% of the Supabase free cap
          # (and whenever the metrics are missing - fail closed).
          printf '%s' "$resp" | python3 scripts/check_probe.py --true ok,under_limit
          printf '### Supabase keep-alive\n\n`%s`\n\n' "$resp" >> "$GITHUB_STEP_SUMMARY"

      - name: Supabase liveness probe (capri-ping)
        run: |
          set -euo pipefail
          url="https://znpvstwmzyphmvkhigqp.supabase.co/functions/v1/capri-ping"
          resp=""
          for attempt in 1 2 3 4 5; do
            resp="$(curl -sS --max-time 30 "$url" || true)"
            if printf '%s' "$resp" | python3 scripts/check_probe.py --true ok; then
              break
            fi
            echo "attempt $attempt: unexpected response: $resp"
            sleep 10
          done
          echo "$resp"
          printf '%s' "$resp" | python3 scripts/check_probe.py --true ok

      - name: Vercel production status page
        run: |
          set -euo pipefail
          body=""
          for attempt in 1 2 3; do
            body="$(curl -sSL --max-time 30 https://capri-orcin.vercel.app/ || true)"
            if printf '%s' "$body" | grep -q 'Deployed commit'; then
              break
            fi
            echo "attempt $attempt: status page did not render"
            sleep 10
          done
          printf '%s' "$body" | grep -q 'Deployed commit'

      - name: pg_cron layer-1 watchdog (job armed, scheduler fresh)
        run: |
          set -euo pipefail
          url="https://znpvstwmzyphmvkhigqp.supabase.co/functions/v1/capri-keepalive"
          resp=""
          for attempt in 1 2 3 4 5; do
            resp="$(curl -sS --max-time 30 "$url" || true)"
            if printf '%s' "$resp" | python3 scripts/check_probe.py \
                --true ok,under_limit,cron_active --false cron_stale; then
              break
            fi
            echo "attempt $attempt: cron contract unmet: $resp"
            sleep 10
          done
          echo "$resp"
          # Job armed: fails if the pg_cron job was unscheduled or deleted.
          # Scheduler fresh: fails when a fire is more than 26h late
          # (grace: cron_stale stays false until a first fire exists).
          printf '%s' "$resp" | python3 scripts/check_probe.py \
            --true ok,under_limit,cron_active --false cron_stale
          printf '### pg_cron watchdog\n\n`%s`\n\n' "$resp" >> "$GITHUB_STEP_SUMMARY"
