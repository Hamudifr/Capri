name: Lean formalization

on:
  push:
    branches: ["research/pvnp-r37-ops-selector"]
    paths:
      - "research/p_vs_np/formalization/**"
      - ".github/workflows/lean-formalization.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          build: true
          test: false
          lint: false
          use-mathlib-cache: false
          use-github-cache: false
          axiom-audit: true
          axiom-audit-root: PvNP
          build-args: "--wfail"
          lake-package-directory: research/p_vs_np/formalization
