name: Repository quality checks

on:
  # PR heads are validated by pull_request; keep push checks for main.
  push:
    branches: ["main"]
  pull_request:
    branches: ["main", "recovery/non-x5-foundation"]
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs for the same PR or branch/ref.
concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository-contract:
    name: Repository contract (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build and install the package
        run: python -m pip install --no-deps .
      - name: Verify installed CLI
        run: |
          capri --help
          capri doctor --json
      - name: Compile source and tests
        run: python -m compileall -q capri_core capri_runtime tests
      - name: Run Capri Doctor
        run: python -m capri_core doctor
      - name: Run contract and runtime tests
        run: python -m unittest discover -s tests -v
      - name: Run labelled memory retrieval regression gate
        run: python -m benchmarks.memory_retrieval.run
      - name: Validate repository skill packages
        run: python -m capri_core skills validate --root . --json


  notion-live-smoke:
    name: Optional live Notion REST smoke test
    if: ${{ vars.CAPRI_NOTION_LIVE_TESTS == 'true' && github.ref == 'refs/heads/main' }}
    needs: repository-contract
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.15"
      - name: Run opt-in Notion smoke test
        env:
          CAPRI_NOTION_LIVE_TESTS: ${{ vars.CAPRI_NOTION_LIVE_TESTS }}
          NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
          CAPRI_MEMORY_DATA_SOURCE_ID: ${{ vars.CAPRI_MEMORY_DATA_SOURCE_ID }}
        run: python -m capri_runtime.notion_smoke
