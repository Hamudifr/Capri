name: Non-X5 quality checks

on:
  # The recovery branch is PR #1's head; pull_request covers its commits without a duplicate push matrix.
  push:
    branches: ["main"]
  pull_request:
    branches: ["main", "recovery/non-x5-foundation", "feature/capri-doctor"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-contract:
    name: Repository contract (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile source and tests
        run: python -m compileall -q capri_core capri_runtime tests
      - name: Run Capri Doctor
        run: python -m capri_core doctor
      - name: Run non-X5 contract and runtime tests
        run: python -m unittest discover -s tests -v
