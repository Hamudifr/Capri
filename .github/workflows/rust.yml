name: Rust CCEL quality

on:
  push:
    branches: ["main"]
    paths: ["rust/**", "rust-toolchain.toml", ".github/workflows/rust.yml"]
  pull_request:
    branches: ["main"]
    paths: ["rust/**", "rust-toolchain.toml", ".github/workflows/rust.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-ccel-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust-stable:
    name: Latest stable Rust
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Install latest stable Rust
        run: |
          rustup update stable
          rustup default stable
          rustup component add clippy rustfmt
      - name: Record exact toolchain
        run: |
          rustc --version
          cargo --version
          rustc -vV
      - name: Format source with current stable rustfmt
        run: |
          cargo fmt --manifest-path rust/ccel-core/Cargo.toml --all
          cargo fmt --manifest-path rust/ccel-core/Cargo.toml --all -- --check
          git diff --check
      - name: Lint
        run: cargo clippy --manifest-path rust/ccel-core/Cargo.toml --all-targets -- -D warnings
      - name: Test
        run: cargo test --manifest-path rust/ccel-core/Cargo.toml --all-targets
      - name: Release build
        run: cargo build --manifest-path rust/ccel-core/Cargo.toml --release
      - name: Benchmark smoke test
        run: cargo bench --manifest-path rust/ccel-core/Cargo.toml --bench ccel
