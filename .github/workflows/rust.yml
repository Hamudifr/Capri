name: Rust CCEL quality

on:
  push:
    branches: ["main"]
    paths: ["rust/**", "rust-toolchain.toml", ".github/workflows/rust.yml"]
  pull_request:
    branches: ["main"]
    paths: ["rust/**", "rust-toolchain.toml", ".github/workflows/rust.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-ccel-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust-stable:
    name: Latest stable Rust
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Install latest stable Rust
        run: |
          rustup update stable
          rustup default stable
          rustup component add clippy rustfmt
      - name: Record exact toolchain
        run: |
          rustc --version
          cargo --version
          rustc -vV
      - name: Format source with current stable rustfmt
        run: |
          cargo fmt --manifest-path rust/ccel-core/Cargo.toml --all
          cargo fmt --manifest-path rust/ccel-core/Cargo.toml --all -- --check
          git diff --check
      - name: Export rustfmt-normalized source for repository sync
        run: |
          echo "BEGIN_FORMATTED_LIB_RS"
          cat rust/ccel-core/src/lib.rs
          echo "END_FORMATTED_LIB_RS"
          echo "BEGIN_FORMATTED_BENCH_RS"
          cat rust/ccel-core/benches/ccel.rs
          echo "END_FORMATTED_BENCH_RS"
      - name: Lint
        run: cargo clippy --manifest-path rust/ccel-core/Cargo.toml --all-targets -- -D warnings
      - name: Test
        run: cargo test --manifest-path rust/ccel-core/Cargo.toml --lib
      - name: Release build
        run: cargo build --manifest-path rust/ccel-core/Cargo.toml --release
      - name: Set up latest stable Python for matched reference benchmark
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.15"
      - name: Benchmark Rust core
        run: cargo bench --manifest-path rust/ccel-core/Cargo.toml --bench ccel
      - name: Benchmark Python reference on same runner
        run: python benchmarks/ccel_python.py
