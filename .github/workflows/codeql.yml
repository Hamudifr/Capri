name: CodeQL

# Free for public repositories. Analyzes the Python runtime/WSGI app,
# the TypeScript edge functions (supabase/functions), the C session
# store (c/), and the experimental Rust implementation (rust/) with no
# manual build steps. build-mode none is confirmed for the interpreted
# languages and C; the rust row is validated by this workflow's own
# PR checks (rust is a BuiltInLanguage in the pinned codeql-action -
# src/languages/index.ts - but per-language build-mode availability is
# decided by the CodeQL CLI, which the Analyze (rust) job proves).

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Weekly sweep, offset from the keep-alive (04:17) and pg_cron
    # (03:43) windows so free-plan minutes never stack.
    - cron: "11 5 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: c-cpp
            build-mode: none
          - language: rust
            build-mode: none
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          category: "/language:${{ matrix.language }}"
